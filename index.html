<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Puppy's Island Trip</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>


<body>


    <header>
        <h1>My Puppy's Island Trip</h1>

        <p>
            The same three photos will have two different stories.
            Choose one journey and Click to begin!
        </p>
    </header>



    <div class="story-buttons">

        <button id="islandBtn">
            Go to the Island~
        </button>

        <button id="homeBtn">
            Go Home~
        </button>

    </div>



    <p id="direction">
        Choose a journey above!
    </p>



    <main>

        <div id="story-card">

            <h2 id="stage">
                Beginning
            </h2>


            <img
                id="story-image"
                src="img/home.JPG"
                alt="My dog"
            >


            <p id="caption">
                My dog is ready for the journey.
            </p>


            <p id="progress">
                1 / 3
            </p>


            <button id="nextBtn">
                Next →
            </button>

        </div>

    </main>


</body>

</html>
